<style>
:root {

  --green: #2FA36B;

  --danger: #D2463D;
  --font: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --top: max(env(safe-area-inset-top), 10px);
  --bottom: max(env(safe-area-inset-bottom), 14px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: #DCEADF; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

#app { position: relative; height: 100%; width: 100%; max-width: 430px; margin: 0 auto; background: var(--bg); overflow: hidden; }
@media (min-width: 520px) and (min-height: 700px) {
  body { display: grid; place-items: center; }
  #app { height: min(100dvh - 40px, 880px); border-radius: 36px; box-shadow: 0 30px 80px rgba(14, 42, 31, .22), 0 0 0 1px rgba(14, 42, 31, .08); }
  #sheet-root, #toast { max-width: 430px; }
}

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: scale(.985); transition: opacity .24s var(--ease), transform .24s var(--ease), visibility 0s .24s; }
.screen.on { opacity: 1; visibility: visible; transform: none; transition: opacity .24s var(--ease), transform .24s var(--ease); }

/* ---------- bars ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--top) + 4px) 12px 8px; min-height: 56px; position: relative; z-index: 3; }
.bar-actions { display: flex; gap: 2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); transition: background .15s, transform .15s; }
.icon-btn:active { background: rgba(14, 42, 31, .07); transform: scale(.94); }

.map-top { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(to bottom, rgba(238, 247, 238, .96) 55%, rgba(238, 247, 238, 0)); padding-bottom: 22px; pointer-events: none; }
.map-top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 6px; padding-left: 6px; }
.brand-name { font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
#brand-mark { display: grid; }

/* ---------- map ---------- */
#map-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
#map-scroll::-webkit-scrollbar { display: none; }
#map-canvas { background: linear-gradient(to top, #F1F9F0 0%, #E6F4E8 40%, #D3ECD9 80%, #C5E5CF 100%); }
#map-canvas svg { display: block; }
.node { cursor: pointer; }
.node-num { font: 600 15px var(--font); fill: var(--ink-3); text-anchor: middle; dominant-baseline: middle; }
.node-num.now { fill: #fff; font-size: 20px; }
.node-name { font: 500 12px var(--font); fill: var(--ink-2); text-anchor: middle; paint-order: stroke; stroke: #EDF6EE; stroke-width: 5px; stroke-linejoin: round; }
.node.now .node-name { fill: var(--ink); font-weight: 600; }
.zone-k { font: 600 10px var(--font); letter-spacing: .14em; fill: var(--green); }
.zone-n { font: 600 16px var(--font); letter-spacing: -.01em; fill: var(--ink); }
.map-end { font: 500 13px var(--font); fill: var(--ink-2); }
.friend-n { font: 600 11px var(--font); fill: var(--ink); dominant-baseline: middle; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.55); opacity: 0; } }
.bob { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
.node.pop { animation: pop .5s var(--ease); transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { opacity: .2; } 100% { opacity: 1; } }

.map-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 20px calc(var(--bottom) + 6px); background: linear-gradient(to top, rgba(241, 249, 240, 1) 45%, rgba(241, 249, 240, 0)); pointer-events: none; z-index: 3; }
.map-bottom > * { pointer-events: auto; }

.btn-primary { width: 100%; height: 54px; border-radius: 17px; background: var(--ink); color: #fff; font-weight: 600; font-size: 16px; letter-spacing: -.005em; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 24px rgba(14, 42, 31, .22); transition: transform .15s var(--ease), box-shadow .15s; }
.btn-primary:active { transform: scale(.975); box-shadow: 0 4px 12px rgba(14, 42, 31, .2); }
.btn-primary small { font-size: 13px; font-weight: 500; opacity: .62; }
.btn-secondary { width: 100%; height: 50px; border-radius: 16px; background: #EDF4EE; color: var(--ink); font-weight: 600; font-size: 15px; transition: transform .15s; }
.btn-secondary:active { transform: scale(.975); }
.btn-text { width: 100%; height: 46px; color: var(--ink-2); font-weight: 500; font-size: 15px; }
.btn-text.danger { color: var(--danger); }

/* ---------- play ---------- */
.play-title { flex: 1; min-width: 0; margin-left: 4px; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; }
.play-title strong { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.play-title span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
#board-wrap { flex: 1; min-height: 0; position: relative; }
#board { position: absolute; inset: 0; touch-action: none; display: block; }
#btn-fit[hidden] { display: none; }
#btn-fit.zoomed { background: var(--ink); color: #fff; }

#coach { margin: 0 16px 10px; padding: 14px 16px 12px; background: #fff; border-radius: 18px; box-shadow: 0 8px 22px rgba(14, 42, 31, .08), 0 0 0 1px rgba(14, 42, 31, .05); display: flex; gap: 12px; align-items: flex-start; animation: rise .3s var(--ease); }
#coach[hidden] { display: none; }
#coach .coach-who { flex: none; margin-top: -2px; }
#coach p { margin: 0; font-size: 15px; line-height: 1.42; color: var(--ink); }
#coach b { font-weight: 600; color: var(--green-deep); }
#coach .dots { display: flex; gap: 5px; margin-top: 9px; }
#coach .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .25s var(--ease), background .25s; }
#coach .dots i.done { background: var(--green); }
#coach .dots i.cur { background: var(--green); width: 18px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.play-bottom { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 6px 18px calc(var(--bottom) + 6px); }
.tool-btn { width: 52px; height: 52px; border-radius: 17px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(14, 42, 31, .07), 0 4px 12px rgba(14, 42, 31, .05); transition: transform .15s, opacity .15s; }
.tool-btn:active { transform: scale(.93); }
.tool-btn:disabled { opacity: .38; }
.seg { flex: none; width: 124px; height: 52px; padding: 4px; border-radius: 26px; background: #DCE9DF; display: grid; grid-template-columns: 1fr 1fr; position: relative; box-shadow: inset 0 1px 2px rgba(14, 42, 31, .06); }
.seg::before { content: ""; position: absolute; top: 4px; left: 4px; width: 58px; height: 44px; border-radius: 22px; background: #fff; box-shadow: 0 2px 8px rgba(14, 42, 31, .16); transition: transform .22s var(--ease); }
.seg[data-tool="1"]::before { transform: translateX(58px); }
.seg button { position: relative; border-radius: 22px; display: grid; place-items: center; color: var(--ink-3); transition: color .18s; }
.seg button.on { color: var(--ink); }
.seg button svg { width: 20px; height: 20px; }
.seg button.nudge { animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(47, 163, 107, .55); } 50% { box-shadow: 0 0 0 6px rgba(47, 163, 107, 0); } }

/* ---------- sheets ---------- */
#sheet-root { position: fixed; inset: 0; margin: 0 auto; pointer-events: none; z-index: 20; }
.scrim { position: absolute; inset: 0; background: rgba(14, 42, 31, .34); opacity: 0; transition: opacity .26s var(--ease); pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 22px calc(var(--bottom) + 10px); transform: translateY(102%); transition: transform .34s var(--ease); pointer-events: auto; max-height: 88%; overflow-y: auto; }
.open > .scrim { opacity: 1; }

.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
.sheet h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }

.tile { width: 148px; height: 148px; border-radius: 30px; background: var(--green-tint); display: grid; place-items: center; margin: 6px auto 18px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 54px; border-top: 1px solid #EAF1EC; }
.row:first-of-type { border-top: 0; }
.row .lbl { font-weight: 500; }
.row .hint { font-size: 13px; color: var(--ink-2); }
.switch { width: 50px; height: 30px; border-radius: 15px; background: #D6E3D9; position: relative; transition: background .2s; flex: none; }

.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(20px); }
.field { width: 100%; height: 50px; border-radius: 15px; border: 1.5px solid var(--line); padding: 0 14px; font: 500 16px var(--font); color: var(--ink); background: #fff; -webkit-user-select: text; user-select: text; }
.field:focus { border-color: var(--green); outline: none; }
.swatches { display: flex; gap: 8px; margin-top: 12px; }
.swatch { width: 46px; height: 46px; border-radius: 15px; background: #F1F6F2; display: grid; place-items: center; border: 2px solid transparent; }
.swatch.on { border-color: var(--ink); background: #fff; }
.friend-row { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #EAF1EC; }
.friend-row .who { flex: 1; font-weight: 500; }
.friend-row .where { font-size: 13px; color: var(--ink-2); }
.friend-row button { color: var(--ink-3); font-size: 13px; padding: 8px 4px; }
.note { font-size: 13.5px; color: var(--ink-2); margin: 14px 0 0; line-height: 1.45; }
.rules { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 15px; color: var(--ink); }
.rules li { padding-left: 22px; position: relative; }
.rules li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 8px; height: 8px; border-radius: 2.5px; background: var(--green); }

#toast { position: fixed; left: 0; right: 0; top: calc(var(--top) + 62px); margin: 0 auto; display: flex; justify-content: center; pointer-events: none; z-index: 30; padding: 0 20px; }
#toast span { background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 14px; box-shadow: 0 10px 28px rgba(14, 42, 31, .25); opacity: 0; transform: translateY(-8px); transition: opacity .22s var(--ease), transform .22s var(--ease); text-align: center; }
#toast span.on { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .pulse, .bob, .seg button.nudge { animation: none; }
  .screen, .sheet, .scrim { transition-duration: .01s; }
}

  </section>
</div>
<div id="sheet-root"></div>
